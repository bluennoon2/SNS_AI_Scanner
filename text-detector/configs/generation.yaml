# AI 생성 매트릭스 / 프롬프트 버전
prompt_version: "gemini-para-v3"  # paraphrase/hybrid 변형 다양성·유사도 필터 강화

# paraphrase 변형 모드 (작업마다 섞음)
paraphrase_modes:
  - id: tone_shift
    hint: "의미는 유지하되 말투·어휘를 눈에 띄게 바꿔라."
  - id: expand
    hint: "의미를 유지한 채 문장을 자연스럽게 늘리고 표현을 재구성하라."
  - id: reorder
    hint: "정보 순서를 바꾸고 다른 문장 구조로 다시 써라."
  - id: sns_messy
    hint: "ㅋㅋ/ㅠㅠ/줄임말 등 SNS 구어체로 거칠게 다시 써라. 원문 복붙 금지."
  - id: plain_clean
    hint: "담백하고 정제된 문장으로 다시 쓰되 원문 구절을 그대로 쓰지 마라."

source_types:
  - post
  - caption
  - comment
  - review
  - chat

styles:
  - id: casual_emoji
    description: "구어체 + 이모지"
  - id: hashtag_heavy
    description: "해시태그 다수"
  - id: multiline
    description: "줄바꿈 포함 짧은 문단"
  - id: jamo
    description: "ㅋㅋ/ㅠㅠ 구어체"
  - id: plain_formal
    description: "담백하고 정제된 문체"
  - id: rough_humanlike
    description: "사람처럼 거칠고 불완전한 문체를 흉내"

topics:
  - 일상
  - 맛집
  - 여행
  - 운동
  - 영화
  - 쇼핑후기
  - 카페
  - 날씨

length_bins:
  short: { min: 10, max: 19, label: "<20" }
  medium: { min: 20, max: 100, label: "20~100" }
  long: { min: 101, max: 220, label: ">100" }

# provider별 모델 후보 (키가 있을 때 사용). 실제 SDK 모델명은 사용자가 --model로 덮어쓸 수 있음.
providers:
  gemini:
    # 헬스체크 통과 모델 우선 (2026-11-20: gemini-3.1-flash-lite).
    models:
      - "gemini-3.1-flash-lite"
      - "gemini-3.5-flash-lite"
      - "gemini-3.8-flash"
      - "gemini-3.5-flash"
      - "gemini-2.5-flash-lite"
      - "gemini-2.5-flash"
    temperatures: [0.7, 0.9, 1.1]

  openai:
    models: ["gpt-4o-mini"]
    temperatures: [0.7, 0.95]
  anthropic:
    models: ["claude-3-5-haiku-latest"]
    temperatures: [0.7, 1.0]
  mock:
    models: ["mock"]
    temperatures: [0.0]

forbidden:
  - 실존 인물 사칭
  - 혐오 표현 생성
  - 개인정보 포함
  - 불법 행위 조장

meta_prefixes_to_strip:
  - "물론입니다"
  - "다음은"
  - "아래와 같이"
  - "요청하신"
  - "네, "
  - "알겠습니다"

refusal_patterns:
  - "죄송하지만"
  - "도와드릴 수 없습니다"
  - "제공할 수 없습니다"
  - "I can't assist"
  - "I'm unable to"
